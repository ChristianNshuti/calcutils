[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "calcutils_Christian_Nshuti"
version = "0.1.0"
description = "A simple student tutorial math utility package"
readme = "README.md"
authors = [
    { name = "Christian Nshuti", email = "chrisnshuti943@gmail.com" }
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://github.com/ChristianNshuti/calcutils"